image:
  repository: hashicorp/http-echo
  tag: "1.0"
args:
  - -text={"app":"orders-api","status":"ok"}
containerPort: 5678
replicaCount: 3
resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi
tolerations:
  - key: dedicated
    operator: Equal
    value: ml
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: pool
              operator: In
              values:
                - ml
_lastChangedBy: idp-portal
