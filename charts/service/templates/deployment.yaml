{{- if eq (include "service.kind" .) "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  {{- if .Values.backstage.ai.enabled }}
  annotations:
    # Read by the Kubernetes ingestor plugin -> creates/updates a catalog entity.
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/component-type: {{ .Values.backstage.ai.type | quote }}
    terasky.backstage.io/system: "ai-platform"
    terasky.backstage.io/backstage-tags: "ai:true"
    {{- with .Values.backstage.ai.owner }}
    terasky.backstage.io/owner: {{ . | quote }}
    {{- end }}
    {{- with .Values.backstage.ai.description }}
    terasky.backstage.io/description: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "service.podSpec" . | nindent 6 }}
{{- end }}
